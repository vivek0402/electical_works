name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: svkml
          POSTGRES_USER: svkml
          POSTGRES_PASSWORD: svkml
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U svkml -d svkml"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://svkml:svkml@localhost:5432/svkml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest --cov=apps --cov-report=term-missing

  # Same flow a developer runs locally: proves Dockerfile, compose.yaml and Makefile work.
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: make up
      - run: make migrate
      - run: make seed
      - run: make test
      - name: healthz through the running web container
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && exit 0; sleep 2; done
          docker compose logs web; exit 1
      - if: always()
        run: docker compose down -v
