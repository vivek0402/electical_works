[project]
name = "svkml"
version = "0.1.0"
description = "Spares inventory, defectives/Wipro returns and service complaints for SVKML Electrical Works"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.18",
    "psycopg[binary]==3.3.6",
    "django-environ==0.14.0",
    "django-htmx==1.29.0",
    "django-template-partials==25.3",
    "django-tables2==3.0.1",
    "django-filter==26.2",
    "django-pgtrigger==4.17.0",
    "openpyxl==3.1.5",
    "rapidfuzz==3.14.6",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "ruff==0.17.0",
    "pre-commit==4.6.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
