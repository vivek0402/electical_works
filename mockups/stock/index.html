<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOCKUP · Stock Management · SVKML</title>
  <link rel="stylesheet" href="vendor/pico.min.css">

<body>
  <div class="mock-banner">MOCKUP: demo data in your browser, nothing is saved (reload resets it).</div>

        <a href="#in" class="nav-in">⬇ Stock IN</a>

        <a href="#stock">Current stock</a>
        <a href="#items">Items</a>
        <a href="#moves">Movements</a>
        <a href="#low">Low stock</a>
        <a href="#masters">Masters</a>
      </nav>
      <span class="who">👤 Office</span>
    </div>
  </header>
  <main class="container" id="view"><p aria-busy="true">Loading…</p></main>
  <dialog id="dlg"><article id="dlg-body"></article></dialog>
  <script src="vendor/tom-select.complete.min.js"></script>
  <script src="data.js"></script>
