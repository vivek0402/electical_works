<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOCKUP · Stock IN / OUT · SVKML</title>
  <!-- Same CSS as the real app, so the mockup looks like the product will. -->
  <link rel="stylesheet" href="../static/vendor/pico.min.css">
  <link rel="stylesheet" href="../static/css/app.css">
  <style>
    :root { --in:#1e7d43; --out:#b45309; }
    .mock-banner { background:#fff3cd; color:#664d03; padding:.5rem 1rem; text-align:center; font-weight:600; }
    .topbar nav a[aria-current="page"] { font-weight:700; text-decoration:underline; }
    .bigbtns { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin:1rem 0 1.5rem; }
    .bigbtns a { display:flex; flex-direction:column; justify-content:center; min-height:7rem; font-size:1.35rem; }
    .bigbtns a small { font-weight:400; font-size:.85rem; opacity:.9; }
    .btn-in { background:var(--in); border-color:var(--in); color:#fff; }
    .btn-out { background:var(--out); border-color:var(--out); color:#fff; }
    .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; }
    .tiles article { margin:0; padding:1rem; }
    .tiles .num { font-size:2rem; font-weight:700; line-height:1.1; }
    .tiles a { text-decoration:none; color:inherit; }
    @media (max-width: 900px) { .bigbtns, .tiles { grid-template-columns:1fr 1fr; } }
    .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); gap:.75rem; margin-bottom:1rem; }
    .choices label { border:2px solid var(--pico-muted-border-color); border-radius:var(--pico-border-radius); padding:.9rem 1rem; cursor:pointer; margin:0; }
    .choices label:has(input:checked) { border-color:var(--pico-primary); background:var(--pico-primary-background); color:#fff; }
    .choices label { display:block; width:100%; }
    .choices input { display:none; }
    /* Phones: each item line becomes a small card instead of a wide table row. */
    @media (max-width: 768px) {
      table.lines thead { display:none; }
      table.lines tr { display:grid; grid-template-columns:1fr 1fr; gap:.25rem .75rem; padding:.75rem 0;
                       border-bottom:1px solid var(--pico-muted-border-color); }
      table.lines td { display:block; border:none; padding:.1rem 0; text-align:left; }
      table.lines td.n { display:none; }
      table.lines td.wide { grid-column:1 / -1; }
      table.lines td[data-label]::before { content:attr(data-label); display:block; font-size:.8rem; color:var(--pico-muted-color); }
      table.lines input[list] { min-width:0 !important; width:100%; }
      table.lines .qty-in { width:100% !important; }
    }
    .choices small { display:block; opacity:.85; }
    .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:0 1rem; }
    .table-wrap { overflow-x:auto; }
    table.lines input, table.lines select { margin:0; }
    table.lines td { vertical-align:top; }
    table.lines .qty-in { width:6.5rem; }
    .code, .code a { font-family:ui-monospace,Consolas,monospace; font-weight:600; white-space:nowrap; }
    .muted { color:var(--pico-muted-color); font-size:.9rem; }
    .bad { color:var(--pico-del-color); font-weight:600; }
    .good { color:var(--in); font-weight:600; }
    .badge { display:inline-block; padding:.05rem .5rem; border-radius:1rem; font-size:.8rem; font-weight:700; color:#fff; white-space:nowrap; }
    .b-IN { background:var(--in); } .b-OUT { background:var(--out); } .b-MOVE { background:#475569; } .b-REV { background:#7c3aed; }
    td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .flash { border-left:4px solid var(--in); padding:.75rem 1rem; }
    .flash.err { border-left-color:var(--pico-del-color); }
    .actions { display:flex; gap:.75rem; flex-wrap:wrap; }
    .actions > * { width:auto; }
    .tabs { display:flex; gap:.5rem; margin-bottom:1rem; }
    .tabs button { flex:1; }
    button.small, a.small { min-height:2.2rem; padding:.2rem .7rem; font-size:.85rem; width:auto; }
    .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:0 1rem; align-items:end; }
    .reversed td { text-decoration:line-through; opacity:.6; }
    details.notes { margin-top:2rem; }
  </style>
</head>
<body>
  <div class="mock-banner">MOCKUP: fake data in your browser, nothing is saved. Try a Stock IN, then a Stock OUT, then open the item to see its history.</div>

  <header class="container-fluid topbar">
    <nav>
      <ul><li><a href="#home" class="brand"><strong>SVKML</strong></a></li></ul>
      <ul id="nav">
        <li><a href="#home">Home</a></li>
        <li><a href="#in">Stock IN</a></li>
        <li><a href="#out">Stock OUT</a></li>
        <li><a href="#transfer">Transfer</a></li>
        <li><a href="#stock">Current stock</a></li>
        <li><a href="#register">Register</a></li>
        <li><button class="secondary outline small">Logout (Office)</button></li>
      </ul>
    </nav>
  </header>

  <main class="container" id="view"></main>
  <datalist id="itemlist"></datalist>
  <dialog id="dlg"><article id="dlg-body"></article></dialog>

<script>
/* ===================== Fake master data (codes from the client's sample sheets) ===================== */
const LOCATIONS = ["Vizag Office", "Svkml", "TV Shop", "Kartika Class"];
const ME = "Office";
const TYPE_LABEL = { FITTING:"Fitting", DRIVER:"Driver", PCB:"PCB / LED module", LENS:"Lens",
  CONTROLLER:"Controller", SWITCH:"Switch", ACCESSORY:"Accessory", OTHER:"Other" };
const ITEMS = [
  ["LG78-150-700","DRIVER","150W driver 700mA",5,["EDC-150-S105SV-3007"]],
  ["LG76-150-700FH","DRIVER","150W driver 700mA FH",10,[]],
  ["LG76-200-700F","DRIVER","200W driver 700mA",10,[]],
  ["LG75-150-215-70E","DRIVER","150W driver",5,[]],
  ["LG83-072-103-0700","DRIVER","72W driver",10,[]],
  ["LG30-018-054-0300","DRIVER","18W driver 300mA",10,["LG30-018-054-300"]],
  ["LG26-048-0720","DRIVER","48W driver 720mA",5,["LG26-048-720"]],
  ["LG66-036-036-900S","DRIVER","36W driver 900mA",5,[]],
  ["LG66-040-078-480IT","DRIVER","40W driver 480mA",5,[]],
  ["15WATT (190MA)","DRIVER","15W driver 190mA (generic)",10,["15WATT DRIVERS"]],
  ["18WATT DRIVERS","DRIVER","18W driver (generic)",10,[]],
  ["EIO6006","PCB","LED module",10,[]],
  ["EIO9326","PCB","LED module",10,[]],
  ["EIO8437","PCB","LED module",5,["EI08437"]],
  ["WPWG-5050-15SIP","PCB","LED strip PCB",5,[]],
  ["FTS-KC-60-57K","PCB","LED PCB 5700K",50,[]],
  ["LF40-192-060-57-HE","FITTING","Flood light 192W",2,[]],
  ["LL20-111-XXX-65-NE3","FITTING","Linear fitting",0,["LL20-111-XXX-65NE3"]],
  ["LF20-102-060-57-G3","FITTING","Flood light 102W",5,[]],
  ["LENS","LENS","Lens (generic)",0,[]],
  ["BULCK HEAD","ACCESSORY","Bulkhead (generic)",0,[]],
  ["ISENSE DALI CONTROLLER (WCS-IS-DA4)","CONTROLLER","iSense DALI controller",0,[]],
].map(([code,type,desc,reorder,aliases]) => ({code,type,desc,reorder,aliases}));

const DOC = {
  RECEIVED_FROM_WIPRO: { dir:"IN",  bucket:"FRESH",     label:"Fresh stock received from Wipro", hint:"New spares arrived (DC / invoice)" },
  DEFECTIVE_COLLECTED: { dir:"IN",  bucket:"DEFECTIVE", label:"Defective collected from site",  hint:"Failed parts brought back by a technician" },
  OPENING:             { dir:"IN",  bucket:null,        label:"Opening count",                  hint:"First stock count (admin only)" },
  ISSUED_TO_COMPLAINT: { dir:"OUT", bucket:"FRESH",     label:"Issued to site / complaint",     hint:"Fresh spares taken for a repair" },
  RETURNED_TO_WIPRO:   { dir:"OUT", bucket:"DEFECTIVE", label:"Defectives returned to Wipro",   hint:"Sent back for replacement" },
  SCRAPPED:            { dir:"OUT", bucket:null,        label:"Scrapped / written off",         hint:"Damaged or lost (reason required)" },
  TRANSFER:            { dir:"MOVE",bucket:null,        label:"Transfer between locations",     hint:"" },
};
const PREFIX = { IN:"IN", OUT:"OUT", MOVE:"TRF", REV:"REV" };

/* ===================== The ledger: entries are never edited, only reversed ===================== */
let entries = [], seq = { IN:0, OUT:0, MOVE:0, REV:0 }, flash = null;

const norm = s => (s || "").toUpperCase().replace(/[`'"]/g, "").replace(/\s+/g, " ").trim();
const key = s => norm(s).replace(/O/g,"0").replace(/I/g,"1")
  .replace(/(^|[^A-Z0-9])0+([0-9]+)(?=[^A-Z0-9]|$)/g, "$1$2").replace(/[^A-Z0-9]/g, "");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const item = code => ITEMS.find(i => i.code === code);
const today = () => { const d = new Date(); return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`; };

function balance(code, loc, bucket) {
  let q = 0;
  for (const e of entries) for (const l of e.lines)
    if (l.code === code && l.loc === loc && l.bucket === bucket) q += l.qty;
  return q;
}

// Posts an entry if no bucket goes negative. Returns an error message or null.
function post(e) {
  const delta = {};
  for (const l of e.lines) { const k = `${l.code}|${l.loc}|${l.bucket}`; delta[k] = (delta[k] || 0) + l.qty; }
  for (const k in delta) {
    const [code, loc, bucket] = k.split("|"), have = balance(code, loc, bucket);
    if (have + delta[k] < 0) return `Only ${have} NOS of ${code} (${bucket === "FRESH" ? "Fresh" : "Defective"}) at ${loc}.`;
  }
  const dir = e.reverses ? "REV" : DOC[e.type].dir;
  e.no = `${PREFIX[dir]}-${String(++seq[dir]).padStart(4, "0")}`;
  e.seq = entries.length;
  entries.push(e);
  return null;
}

function undo(no, reason) {
  const orig = entries.find(e => e.no === no);
  return post({ type: orig.type, date: today(), ref: orig.ref, party: orig.party, by: ME, reverses: no,
    note: reason, lines: orig.lines.map(l => ({ ...l, qty: -l.qty })) });
}

/* Seed history, so the register and item cards are not empty. */
(function seed() {
  const L = (code, loc, bucket, qty, batch = "", pkd = "") => ({ code, loc, bucket, qty, batch, pkd });
  const V = "Vizag Office";
  post({ type:"OPENING", date:"25-05-2026", ref:"Sheet 25-5-2026", by:"Admin", note:"Imported from Excel", lines:[
    L("LG78-150-700",V,"FRESH",20), L("LG76-150-700FH",V,"FRESH",42), L("LG76-200-700F",V,"FRESH",57),
    L("LG75-150-215-70E",V,"FRESH",18), L("LG83-072-103-0700",V,"FRESH",41), L("LG30-018-054-0300",V,"FRESH",29),
    L("LG26-048-0720",V,"FRESH",4), L("LG66-036-036-900S",V,"FRESH",12), L("LG66-040-078-480IT",V,"FRESH",3),
    L("15WATT (190MA)",V,"FRESH",25), L("EIO6006",V,"FRESH",18), L("EIO9326",V,"FRESH",33), L("EIO8437",V,"FRESH",9),
    L("WPWG-5050-15SIP",V,"FRESH",4), L("FTS-KC-60-57K",V,"FRESH",250), L("LF40-192-060-57-HE",V,"FRESH",3),
    L("LL20-111-XXX-65-NE3",V,"FRESH",1), L("LF20-102-060-57-G3",V,"FRESH",20), L("BULCK HEAD",V,"FRESH",12)]});
  post({ type:"OPENING", date:"25-05-2026", ref:"Sheet 25-5-2026", by:"Admin", note:"Imported from Excel", lines:[
    L("LG66-040-078-480IT",V,"DEFECTIVE",103), L("18WATT DRIVERS",V,"DEFECTIVE",52), L("15WATT (190MA)",V,"DEFECTIVE",34),
    L("LG30-018-054-0300",V,"DEFECTIVE",66), L("EIO9326",V,"DEFECTIVE",30), L("WPWG-5050-15SIP",V,"DEFECTIVE",26),
    L("EIO6006",V,"DEFECTIVE",7), L("LENS",V,"DEFECTIVE",22), L("LG26-048-0720",V,"DEFECTIVE",13),
    L("ISENSE DALI CONTROLLER (WCS-IS-DA4)",V,"DEFECTIVE",5)]});
  post({ type:"RECEIVED_FROM_WIPRO", date:"02-06-2026", ref:"Wipro DC 4471", by:"Office", lines:[
    L("EIO6006",V,"FRESH",20,"B2405","04-2026"), L("LG26-048-0720",V,"FRESH",10,"B2311","03-2026")]});
  post({ type:"TRANSFER", date:"05-06-2026", by:"Office", note:"Buffer stock for TV Shop", lines:[
    L("LG76-200-700F",V,"FRESH",-10), L("LG76-200-700F","TV Shop","FRESH",10)]});
  post({ type:"ISSUED_TO_COMPLAINT", date:"10-06-2026", party:"Laurus Labs Unit-2 · CMP-2026-0007", by:"Ramu", lines:[
    L("EIO6006",V,"FRESH",-6), L("LG30-018-054-0300",V,"FRESH",-4)]});
  post({ type:"DEFECTIVE_COLLECTED", date:"10-06-2026", party:"Laurus Labs Unit-2 · CMP-2026-0007", by:"Ramu", lines:[
    L("EIO6006",V,"DEFECTIVE",6,"B2201","11-2025"), L("LG30-018-054-0300",V,"DEFECTIVE",4)]});
  post({ type:"RETURNED_TO_WIPRO", date:"15-06-2026", ref:"Return batch RB-2026-003", by:"Office", lines:[
    L("LG66-040-078-480IT",V,"DEFECTIVE",-50), L("18WATT DRIVERS",V,"DEFECTIVE",-51)]});
  post({ type:"ISSUED_TO_COMPLAINT", date:"18-06-2026", party:"Barc · CMP-2026-0004", by:"Apparao", lines:[
    L("15WATT (190MA)",V,"FRESH",-18)]});
})();

/* ===================== Item lookup: code, alias, typo-tolerant ===================== */
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// -> {item, via} exact/alias/lookalike match, or {suggest:[items]} when nothing matches.
function lookup(text) {
  const t = norm(text), k = key(text);
  if (!t) return {};
  for (const i of ITEMS) {
    if (i.code === t) return { item: i };
    if (i.aliases.includes(t)) return { item: i, via: t };
    if (key(i.code) === k || i.aliases.some(a => key(a) === k)) return { item: i, via: t };
  }
  const suggest = ITEMS.map(i => ({ i, d: Math.min(lev(key(i.code), k), ...i.aliases.map(a => lev(key(a), k))) }))
    .filter(x => x.d <= 2 || key(x.i.code).includes(k) || (x.i.desc.toUpperCase().includes(t) && t.length > 2))
    .sort((a, b) => a.d - b.d).slice(0, 3).map(x => x.i);
  return { suggest };
}
function refreshDatalist() {
  document.getElementById("itemlist").innerHTML = ITEMS.flatMap(i =>
    [`<option value="${esc(i.code)}">${esc(TYPE_LABEL[i.type] + " · " + i.desc)}</option>`,
     ...i.aliases.map(a => `<option value="${esc(a)}">→ ${esc(i.code)}</option>`)]).join("");
}

/* ===================== Screens ===================== */
const view = () => document.getElementById("view");
const badge = e => e.reverses ? `<span class="badge b-REV">UNDO</span>` : `<span class="badge b-${DOC[e.type].dir}">${DOC[e.type].dir === "MOVE" ? "TRANSFER" : DOC[e.type].dir}</span>`;
const locsOf = e => [...new Set(e.lines.map(l => l.loc))].join(" → ");
const totalQty = e => e.type === "TRANSFER" ? e.lines.filter(l => l.qty > 0).reduce((a, l) => a + l.qty, 0)
                                             : e.lines.reduce((a, l) => a + Math.abs(l.qty), 0);
const isReversed = e => entries.some(x => x.reverses === e.no);
const flashHtml = () => { if (!flash) return ""; const f = flash; flash = null;
  return `<article class="flash ${f.err ? "err" : ""}">${f.msg}</article>`; };

function entryRows(list) {
  return list.map(e => `<tr class="${isReversed(e) ? "reversed" : ""}">
    <td class="code"><a href="#entry/${e.no}">${e.no}</a></td><td>${e.date}</td>
    <td>${badge(e)} ${esc(e.reverses ? "Undo of " + e.reverses : DOC[e.type].label)}</td>
    <td>${esc(locsOf(e))}</td><td class="num">${e.lines.length}</td><td class="num">${totalQty(e)} NOS</td>
    <td>${esc(e.party || e.ref || "")}</td><td>${esc(e.by)}</td></tr>`).join("");
}
const ENTRY_HEAD = `<tr><th>Entry</th><th>Date</th><th>What</th><th>Location</th><th class="num">Lines</th><th class="num">Qty</th><th>Ref / party</th><th>By</th></tr>`;

function stockRows(bucket) {
  const rows = [];
  for (const i of ITEMS) for (const loc of LOCATIONS) {
    const q = balance(i.code, loc, bucket);
    if (q > 0) rows.push({ i, loc, q });
  }
  return rows;
}

function renderHome() {
  const fresh = stockRows("FRESH"), def = stockRows("DEFECTIVE");
  const low = ITEMS.filter(i => i.reorder > 0 && LOCATIONS.reduce((a, l) => a + balance(i.code, l, "FRESH"), 0) <= i.reorder);
  const todays = entries.filter(e => e.date === today()).length;
  view().innerHTML = `${flashHtml()}
    <h1>Hello, ${ME}</h1>
    <div class="bigbtns">
      <a href="#in" role="button" class="btn-in">⬇ Stock IN<small>Receive fresh · collect defective</small></a>
      <a href="#out" role="button" class="btn-out">⬆ Stock OUT<small>Issue to site · return to Wipro</small></a>
      <a href="#transfer" role="button" class="secondary">⇄ Transfer<small>Between locations</small></a>
      <a href="#stock" role="button" class="contrast">📋 Current stock<small>Fresh & defective lists</small></a>
    </div>
    <div class="tiles">
      <a href="#stock"><article><div class="num">${fresh.reduce((a, r) => a + r.q, 0)}</div>NOS fresh in stock</article></a>
      <a href="#stock/DEFECTIVE"><article><div class="num">${def.reduce((a, r) => a + r.q, 0)}</div>NOS defective waiting</article></a>
      <a href="#stock/low"><article><div class="num ${low.length ? "bad" : ""}">${low.length}</div>items at / below reorder level</article></a>
      <a href="#register"><article><div class="num">${todays}</div>entries today</article></a>
    </div>
    <h3 style="margin-top:2rem">Recent entries</h3>
    <div class="table-wrap"><table class="striped"><thead>${ENTRY_HEAD}</thead>
      <tbody>${entryRows(entries.slice(-6).reverse())}</tbody></table></div>
    <a href="#register">See all entries →</a>`;
}

/* ---------- Entry form (IN / OUT / TRANSFER) ---------- */
let form = null;
function newForm(mode, prefill) {
  const type = mode === "in" ? "RECEIVED_FROM_WIPRO" : mode === "out" ? "ISSUED_TO_COMPLAINT" : "TRANSFER";
  form = { mode, type, date: today(), loc: "Vizag Office", to: "TV Shop", bucket: "FRESH", ref: "", party: "", note: "",
           lines: [{ text: prefill || "", qty: "", batch: "", pkd: "" }], error: "" };
}
const bucketOf = () => DOC[form.type].bucket || form.bucket;

function renderForm(mode, prefill) {
  if (!form || form.mode !== mode || prefill !== undefined) newForm(mode, prefill);
  const dir = DOC[form.type].dir, isIn = dir === "IN", isOut = dir === "OUT", isMove = dir === "MOVE";
  const choices = Object.entries(DOC).filter(([, d]) => d.dir === dir && dir !== "MOVE").map(([t, d]) =>
    `<label><input type="radio" name="type" value="${t}" ${t === form.type ? "checked" : ""} onchange="setF('type',this.value)">
      <strong>${d.label}</strong><small>${d.hint}</small></label>`).join("");
  const title = isIn ? "⬇ Stock IN" : isOut ? "⬆ Stock OUT" : "⇄ Transfer";
  const locOpts = sel => LOCATIONS.map(l => `<option ${l === sel ? "selected" : ""}>${l}</option>`).join("");
  const bucketSel = (isMove || !DOC[form.type].bucket) ? `<label>Stock type
      <select onchange="setF('bucket',this.value)"><option value="FRESH" ${form.bucket === "FRESH" ? "selected" : ""}>Fresh</option>
      <option value="DEFECTIVE" ${form.bucket === "DEFECTIVE" ? "selected" : ""}>Defective</option></select></label>` : "";
  const partyLabel = { DEFECTIVE_COLLECTED:"Collected from (customer / site · complaint no.)",
    ISSUED_TO_COMPLAINT:"Issued for (customer / site · complaint no.)" }[form.type];
  const refLabel = { RECEIVED_FROM_WIPRO:"Wipro DC / invoice no.", RETURNED_TO_WIPRO:"Return batch / Wipro ref",
    OPENING:"Reference (e.g. count sheet)" }[form.type];
  view().innerHTML = `
    <h1>${title}</h1>
    ${choices ? `<p class="muted">What are you doing?</p><div class="choices">${choices}</div>` : ""}
    <div class="fields">
      <label>Date <input value="${form.date}" onchange="setF('date',this.value,true)" placeholder="DD-MM-YYYY"></label>
      <label>${isMove ? "From location" : isIn ? "Into location" : "From location"}
        <select onchange="setF('loc',this.value)">${locOpts(form.loc)}</select></label>
      ${isMove ? `<label>To location <select onchange="setF('to',this.value)">${locOpts(form.to)}</select></label>` : ""}
      ${bucketSel}
      ${refLabel ? `<label>${refLabel} <input value="${esc(form.ref)}" onchange="setF('ref',this.value,true)"></label>` : ""}
      ${partyLabel ? `<label>${partyLabel} <input list="parties" value="${esc(form.party)}" onchange="setF('party',this.value,true)" placeholder="e.g. Laurus Labs Unit-2 · CMP-2026-0007"></label>` : ""}
      ${form.type === "SCRAPPED" || isMove ? `<label>${form.type === "SCRAPPED" ? "Reason (required)" : "Note"}
        <input value="${esc(form.note)}" onchange="setF('note',this.value,true)"></label>` : ""}
    </div>
    <datalist id="parties"><option>Laurus Labs Unit-2 · CMP-2026-0007</option><option>Barc · CMP-2026-0004</option>
      <option>GMR Air port · CMP-2026-0010</option><option>Dr Reddys · CMP-2026-0012</option></datalist>

    <h3>Items <span class="muted">(${bucketOf() === "FRESH" ? "Fresh" : "Defective"} stock)</span></h3>
    <div class="table-wrap"><table class="lines">
      <thead><tr><th>#</th><th>Item code</th><th>Item</th>${isIn ? "" : `<th class="num">Available</th>`}
        <th>Qty (NOS)</th>${isIn ? "<th>Batch code</th><th>PKD (MM-YYYY)</th>" : ""}<th></th></tr></thead>
      <tbody id="lines"></tbody></table></div>
    <button class="secondary outline small" onclick="addLine()">+ Add another item</button>
    <div id="form-error">${form.error ? `<article class="flash err">${esc(form.error)}</article>` : ""}</div>
    <div class="actions" style="margin-top:1rem">
      <button class="${isIn ? "btn-in" : isOut ? "btn-out" : ""}" onclick="save()">Save ${isIn ? "Stock IN" : isOut ? "Stock OUT" : "transfer"}</button>
      <a href="#home" role="button" class="secondary outline">Cancel</a>
    </div>
    <p class="muted">Typing tip: you can type an old spelling (EI08437, LG26-048-720) or a near-miss (EIO6O06); the app finds the right item.</p>`;
  renderLines();
}

// Redraw on the next tick: a change event fired by blur must not replace the node being blurred.
let redrawQueued = false;
function renderLinesSoon() {
  if (redrawQueued) return;
  redrawQueued = true;
  setTimeout(() => { redrawQueued = false; renderLines(); });
}

function renderLines() {
  if (!form || !document.getElementById("lines")) return;
  const isIn = DOC[form.type].dir === "IN", bucket = bucketOf();
  document.getElementById("lines").innerHTML = form.lines.map((l, n) => {
    const r = lookup(l.text);
    let info = "", avail = "";
    if (r.item) {
      info = `<span class="good">✓</span> ${esc(TYPE_LABEL[r.item.type])} · ${esc(r.item.desc)}` +
             (r.via ? `<br><span class="muted">you typed ${esc(r.via)} → ${esc(r.item.code)}</span>` : "");
      const have = balance(r.item.code, form.loc, bucket);
      const short = !isIn && Number(l.qty) > have;
      avail = `<td data-label="Available" class="num ${short ? "bad" : ""}">${have} NOS${short ? `<br><small>Only ${have} NOS at ${esc(form.loc)}</small>` : ""}</td>`;
    } else if (l.text.trim()) {
      info = `<span class="bad">Not found.</span> ` +
        (r.suggest.length ? `Did you mean ${r.suggest.map(s => `<a href="#" onclick="pick(${n},'${esc(s.code)}');return false" class="code">${esc(s.code)}</a>`).join(", ")}? ` : "") +
        (isIn ? `<button class="small secondary" onclick="newItem(${n})">+ Create item ${esc(norm(l.text))}</button>` : "");
      avail = `<td data-label="Available"></td>`;
    } else { avail = `<td data-label="Available"></td>`; }
    return `<tr><td class="n">${n + 1}</td>
      <td class="wide" data-label="Item ${n + 1}"><input list="itemlist" value="${esc(l.text)}" placeholder="Type code…" onchange="setLine(${n},'text',this.value)" style="min-width:14rem"></td>
      <td class="wide">${info}</td>${isIn ? "" : avail}
      <td data-label="Qty (NOS)"><input class="qty-in" type="number" min="1" value="${esc(l.qty)}" oninput="setLine(${n},'qty',this.value,true)" onchange="renderLinesSoon()"></td>
      ${isIn ? `<td data-label="Batch code"><input value="${esc(l.batch)}" onchange="setLine(${n},'batch',this.value,true)" style="width:8rem"></td>
                <td data-label="PKD"><input value="${esc(l.pkd)}" onchange="setLine(${n},'pkd',this.value,true)" placeholder="MM-YYYY" style="width:8rem"></td>` : ""}
      <td>${form.lines.length > 1 ? `<button class="small secondary outline" onclick="removeLine(${n})" title="Remove">✕</button>` : ""}</td></tr>`;
  }).join("");
}

function setF(k, v, quiet) { form[k] = v; form.error = ""; if (!quiet) renderForm(form.mode); }
function setLine(n, k, v, quiet) { form.lines[n][k] = v; if (!quiet) renderLinesSoon(); }
function addLine() { form.lines.push({ text: "", qty: "", batch: "", pkd: "" }); renderLines(); }
function removeLine(n) { form.lines.splice(n, 1); renderLines(); }
function pick(n, code) { form.lines[n].text = code; renderLines(); }

function newItem(n) {
  const code = norm(form.lines[n].text);
  document.getElementById("dlg-body").innerHTML = `<header><strong>Create new item</strong></header>
    <label>Code <input id="ni-code" value="${esc(code)}"></label>
    <label>Type <select id="ni-type">${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
    <label>Description <input id="ni-desc" placeholder="e.g. 24W driver 500mA"></label>
    <footer class="actions"><button class="secondary" onclick="dlg.close()">Cancel</button>
      <button onclick="createItem(${n})">Create item</button></footer>`;
  dlg.showModal();
}
function createItem(n) {
  const code = norm(document.getElementById("ni-code").value);
  if (!code || lookup(code).item) { alert("That code is empty or already exists."); return; }
  ITEMS.push({ code, type: document.getElementById("ni-type").value, desc: document.getElementById("ni-desc").value || "(new item)", reorder: 0, aliases: [] });
  refreshDatalist(); form.lines[n].text = code; dlg.close(); renderLines();
}

function save() {
  const d = DOC[form.type], bucket = bucketOf(), lines = [];
  const fail = msg => { form.error = msg; document.getElementById("form-error").innerHTML = `<article class="flash err">${esc(msg)}</article>`; };
  if (!/^\d{2}-\d{2}-\d{4}$/.test(form.date)) return fail("Date must be DD-MM-YYYY.");
  if (form.type === "SCRAPPED" && !form.note.trim()) return fail("Please give a reason for scrapping.");
  if (d.dir === "MOVE" && form.loc === form.to) return fail("Choose two different locations.");
  for (const [n, l] of form.lines.entries()) {
    if (!l.text.trim() && !l.qty) continue;
    const r = lookup(l.text), q = Number(l.qty);
    if (!r.item) return fail(`Line ${n + 1}: pick a known item (or create it).`);
    if (!Number.isInteger(q) || q <= 0) return fail(`Line ${n + 1}: quantity must be a whole number above 0.`);
    const base = { code: r.item.code, bucket, batch: l.batch || "", pkd: l.pkd || "" };
    if (d.dir === "IN") lines.push({ ...base, loc: form.loc, qty: q });
    else if (d.dir === "OUT") lines.push({ ...base, loc: form.loc, qty: -q });
    else lines.push({ ...base, loc: form.loc, qty: -q }, { ...base, loc: form.to, qty: q });
  }
  if (!lines.length) return fail("Add at least one item with a quantity.");
  const e = { type: form.type, date: form.date, ref: form.ref, party: form.party, note: form.note, by: ME, lines };
  const err = post(e);
  if (err) return fail(err + " Nothing was saved.");
  flash = { msg: `Saved <strong>${e.no}</strong>: ${lines.length} line(s), ${totalQty(e)} NOS. Stock updated.` };
  form = null;
  location.hash = `#entry/${e.no}`;
}

/* ---------- Entry detail + undo ---------- */
function renderEntry(no) {
  const e = entries.find(x => x.no === no);
  if (!e) { view().innerHTML = "<p>Entry not found.</p>"; return; }
  const undoneBy = entries.find(x => x.reverses === e.no);
  view().innerHTML = `${flashHtml()}
    <h1><span class="code">${e.no}</span> ${badge(e)}</h1>
    <p><strong>${esc(e.reverses ? "Undo of " + e.reverses : DOC[e.type].label)}</strong> · ${e.date} · by ${esc(e.by)}
      ${e.ref ? ` · Ref: ${esc(e.ref)}` : ""}${e.party ? ` · ${esc(e.party)}` : ""}${e.note ? `<br><span class="muted">${esc(e.note)}</span>` : ""}</p>
    ${undoneBy ? `<article class="flash err">This entry was undone by <a href="#entry/${undoneBy.no}">${undoneBy.no}</a>. Both stay on record.</article>` : ""}
    ${e.reverses ? `<p class="muted">Cancels <a href="#entry/${e.reverses}">${e.reverses}</a>.</p>` : ""}
    <div class="table-wrap"><table class="striped"><thead><tr><th>Item</th><th>Location</th><th>Stock</th>
      <th class="num">IN</th><th class="num">OUT</th><th>Batch</th><th>PKD</th></tr></thead><tbody>
      ${e.lines.map(l => `<tr><td class="code"><a href="#item/${encodeURIComponent(l.code)}">${esc(l.code)}</a></td><td>${l.loc}</td>
        <td>${l.bucket === "FRESH" ? "Fresh" : "Defective"}</td><td class="num good">${l.qty > 0 ? l.qty : ""}</td>
        <td class="num bad">${l.qty < 0 ? -l.qty : ""}</td><td>${esc(l.batch)}</td><td>${esc(l.pkd)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="actions">
      <a href="#register" role="button" class="secondary outline">← Register</a>
      ${!undoneBy && !e.reverses ? `<button class="secondary" onclick="askUndo('${e.no}')">Undo this entry…</button>` : ""}
    </div>
    <p class="muted">Entries are never edited or deleted. "Undo" adds an opposite entry, so the history always shows what happened.</p>`;
}
function askUndo(no) {
  document.getElementById("dlg-body").innerHTML = `<header><strong>Undo ${no}?</strong></header>
    <p>This adds a new entry that reverses every line of ${no}.</p>
    <label>Reason (required) <input id="undo-reason" placeholder="e.g. wrong item entered"></label>
    <div id="undo-err"></div>
    <footer class="actions"><button class="secondary" onclick="dlg.close()">Keep it</button>
      <button onclick="doUndo('${no}')">Undo entry</button></footer>`;
  dlg.showModal();
}
function doUndo(no) {
  const reason = document.getElementById("undo-reason").value.trim();
  if (!reason) { document.getElementById("undo-err").innerHTML = `<p class="bad">Please give a reason.</p>`; return; }
  const err = undo(no, reason);
  if (err) { document.getElementById("undo-err").innerHTML = `<p class="bad">${esc(err)} Cannot undo: that stock has already been used.</p>`; return; }
  dlg.close(); flash = { msg: `${no} undone. A reversing entry was added.` }; renderEntry(no);
}

/* ---------- Current stock ---------- */
let stockState = { bucket: "FRESH", loc: "", q: "", low: false };
function renderStock(arg) {
  if (arg === "DEFECTIVE") stockState = { ...stockState, bucket: "DEFECTIVE", low: false };
  if (arg === "low") stockState = { ...stockState, bucket: "FRESH", low: true };
  const s = stockState, q = key(s.q);
  let rows = stockRows(s.bucket).filter(r => (!s.loc || r.loc === s.loc) &&
    (!q || key(r.i.code).includes(q) || r.i.aliases.some(a => key(a).includes(q)) || r.i.desc.toUpperCase().includes(s.q.toUpperCase())));
  if (s.low) {
    rows = ITEMS.filter(i => i.reorder > 0).map(i => ({ i, loc: "All", q: LOCATIONS.reduce((a, l) => a + balance(i.code, l, "FRESH"), 0) }))
      .filter(r => r.q <= r.i.reorder);
  }
  const col = t => t === "DRIVER" ? 2 : t === "PCB" ? 3 : 1;
  view().innerHTML = `
    <div class="tabs">
      <button class="${s.bucket === "FRESH" && !s.low ? "" : "secondary"}" onclick="stockState={...stockState,bucket:'FRESH',low:false};renderStock()">Fresh List</button>
      <button class="${s.bucket === "DEFECTIVE" ? "" : "secondary"}" onclick="stockState={...stockState,bucket:'DEFECTIVE',low:false};renderStock()">Defective List</button>
      <button class="${s.low ? "" : "secondary"}" onclick="stockState={...stockState,bucket:'FRESH',low:true};renderStock()">Low stock</button>
    </div>
    <div class="filters">
      <label>Location <select onchange="stockState.loc=this.value;renderStock()" ${s.low ? "disabled" : ""}>
        <option value="">All locations</option>${LOCATIONS.map(l => `<option ${l === s.loc ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>Search <input type="search" value="${esc(s.q)}" placeholder="code, old spelling or description"
        onchange="stockState.q=this.value;renderStock()"></label>
      <button class="secondary" onclick="alert('Downloads the list in your Excel layout (S.NO | FITTING CODE | BATCH CODE | DRIVER CODE | PCB CODE | QUANTITY).')">⬇ Export to Excel</button>
    </div>
    <p class="muted">${rows.length} items · ${rows.reduce((a, r) => a + r.q, 0)} NOS ${s.low ? "· items at or below their reorder level (all locations)" : ""}</p>
    <div class="table-wrap"><table class="striped">
      <thead><tr><th>S.NO</th><th>FITTING CODE</th><th>DRIVER CODE</th><th>PCB CODE</th><th class="num">QUANTITY</th>
        ${s.low ? `<th class="num">REORDER AT</th>` : "<th>LOCATION</th>"}<th></th></tr></thead>
      <tbody>${rows.map((r, n) => {
        const cells = ["", "", ""]; cells[col(r.i.type) - 1] = `<a href="#item/${encodeURIComponent(r.i.code)}">${esc(r.i.code)}</a>`;
        const low = r.i.reorder > 0 && r.q <= r.i.reorder && s.bucket === "FRESH";
        return `<tr><td>${n + 1}</td>${cells.map(c => `<td class="code">${c}</td>`).join("")}
          <td class="num ${low ? "bad" : ""}">${r.q} NOS</td><td class="${s.low ? "num" : ""}">${s.low ? r.i.reorder + " NOS" : r.loc}</td>
          <td><a href="#out/${encodeURIComponent(r.i.code)}" class="small">OUT</a> · <a href="#in/${encodeURIComponent(r.i.code)}" class="small">IN</a></td></tr>`;
      }).join("") || `<tr><td colspan="7">Nothing here.</td></tr>`}</tbody></table></div>`;
}

/* ---------- Item card: stock per location + full in/out history ---------- */
function renderItem(code) {
  const i = item(code);
  if (!i) { view().innerHTML = "<p>Item not found.</p>"; return; }
  const running = {};
  const hist = [];
  for (const e of entries) for (const l of e.lines) if (l.code === code) {
    const k = l.loc + "|" + l.bucket; running[k] = (running[k] || 0) + l.qty;
    hist.push({ e, l, after: running[k] });
  }
  view().innerHTML = `
    <h1 class="code">${esc(i.code)}</h1>
    <p>${esc(TYPE_LABEL[i.type])} · ${esc(i.desc)} · Brand Wipro · Reorder at ${i.reorder} NOS
      ${i.aliases.length ? `<br><span class="muted">Also written as: ${i.aliases.map(esc).join(", ")}</span>` : ""}</p>
    <div class="actions" style="margin-bottom:1rem">
      <a href="#in/${encodeURIComponent(code)}" role="button" class="btn-in">⬇ Stock IN</a>
      <a href="#out/${encodeURIComponent(code)}" role="button" class="btn-out">⬆ Stock OUT</a>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Location</th><th class="num">Fresh</th><th class="num">Defective</th></tr></thead><tbody>
      ${LOCATIONS.map(l => `<tr><td>${l}</td><td class="num">${balance(code, l, "FRESH")}</td><td class="num">${balance(code, l, "DEFECTIVE")}</td></tr>`).join("")}
      <tr><th>Total</th><th class="num">${LOCATIONS.reduce((a, l) => a + balance(code, l, "FRESH"), 0)}</th>
        <th class="num">${LOCATIONS.reduce((a, l) => a + balance(code, l, "DEFECTIVE"), 0)}</th></tr></tbody></table></div>
    <h3>History</h3>
    <div class="table-wrap"><table class="striped"><thead><tr><th>Date</th><th>Entry</th><th>What</th><th>Location</th><th>Stock</th>
      <th class="num">IN</th><th class="num">OUT</th><th class="num">Balance</th><th>Ref / party</th><th>By</th></tr></thead><tbody>
      ${hist.reverse().map(({ e, l, after }) => `<tr><td>${e.date}</td><td class="code"><a href="#entry/${e.no}">${e.no}</a></td>
        <td>${badge(e)} ${esc(e.reverses ? "Undo" : DOC[e.type].label)}</td><td>${l.loc}</td><td>${l.bucket === "FRESH" ? "Fresh" : "Defective"}</td>
        <td class="num good">${l.qty > 0 ? l.qty : ""}</td><td class="num bad">${l.qty < 0 ? -l.qty : ""}</td><td class="num"><strong>${after}</strong></td>
        <td>${esc(e.party || e.ref || "")}</td><td>${esc(e.by)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted">Balance = stock left at that location in that stock type after the entry.</p>`;
}

/* ---------- Register: every entry ---------- */
let regState = { dir: "", loc: "", q: "" };
function renderRegister() {
  const s = regState, q = norm(s.q);
  const list = entries.filter(e => (!s.dir || (e.reverses ? "REV" : DOC[e.type].dir) === s.dir) &&
    (!s.loc || e.lines.some(l => l.loc === s.loc)) &&
    (!q || e.no.includes(q) || norm(e.ref).includes(q) || norm(e.party).includes(q) || e.lines.some(l => l.code.includes(q))))
    .slice().reverse();
  view().innerHTML = `<h1>Register <span class="muted">(every stock entry)</span></h1>
    <div class="filters">
      <label>Show <select onchange="regState.dir=this.value;renderRegister()">
        ${[["","All entries"],["IN","Stock IN"],["OUT","Stock OUT"],["MOVE","Transfers"],["REV","Undos"]]
          .map(([v, t]) => `<option value="${v}" ${v === s.dir ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label>Location <select onchange="regState.loc=this.value;renderRegister()"><option value="">All locations</option>
        ${LOCATIONS.map(l => `<option ${l === s.loc ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>Search <input type="search" value="${esc(s.q)}" placeholder="entry no, DC no, customer, item code"
        onchange="regState.q=this.value;renderRegister()"></label>
    </div>
    <div class="table-wrap"><table class="striped"><thead>${ENTRY_HEAD}</thead><tbody>${entryRows(list)}</tbody></table></div>
    <p class="muted">Struck-through rows were undone; open them to see the reversing entry.</p>
    <details class="notes"><summary>Design notes for review</summary><ul>
      <li><strong>Stock IN</strong>: fresh received from Wipro (DC no., batch, PKD), defective collected from a site (customer and complaint), or an opening count.</li>
      <li><strong>Stock OUT</strong>: issued to a site or complaint, defectives returned to Wipro, or scrapped (reason required). You can't take out more than is in stock; you'll see "Only N NOS of … at …".</li>
      <li><strong>Transfer</strong> moves stock between Vizag Office, Svkml, TV Shop and Kartika Class in one entry.</li>
      <li>Every save gets an entry number (IN-0004, OUT-0003, TRF-0001). Nothing is edited or deleted; <strong>Undo</strong> adds a reversing entry with a reason.</li>
      <li>Item search accepts old spellings and typos, and unknown codes can be created on the spot during Stock IN.</li>
      <li>Later phases plug in here: complaints (issue/collect from a complaint visit), Wipro return batches (group defectives, print the Wipro list), and the technician phone view.</li>
    </ul></details>`;
}

/* ===================== Router ===================== */
function route() {
  const [name, ...rest] = (location.hash.slice(1) || "home").split("/");
  const arg = rest.length ? decodeURIComponent(rest.join("/")) : undefined;
  document.querySelectorAll("#nav a").forEach(a => a.toggleAttribute("aria-current", a.getAttribute("href") === "#" + name));
  if (name === "in" || name === "out" || name === "transfer") renderForm(name, arg);
  else if (name === "entry") renderEntry(arg);
  else if (name === "stock") renderStock(arg);
  else if (name === "item") renderItem(arg);
  else if (name === "register") renderRegister();
  else renderHome();
  window.scrollTo(0, 0);
}
const dlg = document.getElementById("dlg");
refreshDatalist();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
