{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<article class="login-card">
  <header><h2>SVKML Electrical Works</h2><p>Sign in to continue</p></header>
  {% if form.non_field_errors %}
    <p class="flash flash-error">Wrong username or password. Please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username
      <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus
             value="{{ form.username.value|default:'' }}">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</article>
{% endblock %}
