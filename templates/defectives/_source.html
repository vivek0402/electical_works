{# Where a piece came from. Needs `p`, a DefectivePiece from selectors.pieces_qs() (visit, complaint and site loaded). #}
{% if p.visit_id %}<span><i class="ti ti-map-pin text-secondary"></i> <a class="code" href="{% url 'complaint_detail' p.visit.complaint.number %}">{{ p.visit.complaint.number }}</a></span><div class="small text-secondary">{{ p.visit.complaint.site }}</div>{% elif p.source == "SITE_VISIT" %}<span><i class="ti ti-map-pin text-secondary"></i> Site visit</span>{% else %}<span class="text-secondary"><i class="ti ti-building-warehouse"></i> Found in stock</span>{% endif %}
