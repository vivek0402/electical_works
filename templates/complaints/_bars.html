{# Bar list: one hue, value labels, red only when the row needs attention. Needs `rows` [{label, n, href, alert}] and `top`. #}
<div class="b-bars">{% for r in rows %}<a href="{{ r.href }}" class="{% if r.alert %}late{% endif %}"><span>{{ r.label }}</span><i style="width:{% widthratio r.n top 100 %}%"></i><b>{{ r.n }}</b></a>
{% empty %}<p class="empty">Nothing open.</p>{% endfor %}</div>
